name: Build Mono APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK something recognisable
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Mono.apk

      # Download this from the run's "Artifacts" section, then follow the
      # install instructions in the README.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mono-apk
          path: out/Mono.apk
          if-no-files-found: error

      # Tests and lint run after the upload so a failure in either is loud, but
      # the APK from that same commit is still downloadable rather than lost
      # with the job.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Show the lint findings
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
