name: Build Dad's Victory APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-logic:
    name: Verify core logic (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compiles and unit-tests the real com.dadsvictory.domain sources on a plain
      # JVM: streak arithmetic, money estimates, achievement rules, the content
      # rotation, notification scheduling and the encrypted backup format.
      # No Android SDK needed, so this is the fast gate.
      - name: Run domain tests
        run: ./gradlew -p tools/logic-verify test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-report
          path: tools/logic-verify/build/reports/tests/test
          if-no-files-found: ignore

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: verify-logic
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon
        continue-on-error: true

      - name: Name the APK something recognisable
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/DadsVictory.apk

      # Download this from the run's "Artifacts" section, then follow the install
      # instructions in the README.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DadsVictory-apk
          path: out/DadsVictory.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
