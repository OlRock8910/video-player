name: Build Mono APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  # Needed to publish the APK as a release asset.
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy "tools" package from the SDK repository,
          # and the action installs it by default — sdkmanager then exits 1 and
          # the job dies before Gradle runs. An empty list skips that step; the
          # runner image already ships the SDK, and Gradle fetches whatever
          # platform and build-tools the project asks for.
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK something recognisable
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Mono.apk

      # Download this from the run's "Artifacts" section, then follow the
      # install instructions in the README.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mono-apk
          path: out/Mono.apk
          if-no-files-found: error

      # Artifacts can only be downloaded by someone signed in to GitHub, and
      # they arrive zipped — on a phone that is several confusing steps. A
      # release asset is a plain file anyone can fetch with one tap, so the APK
      # is also published to a rolling "android-latest" tag that always points
      # at the newest successful build.
      - name: Publish the APK as a release
        # Belt and braces, not a fix for an observed failure: without a
        # deadline an upload that never returns would hold the job for six
        # hours, and the release would sit there with no APK on it the whole
        # time (see --clobber below).
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          tag="android-latest"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Mono for Android (latest build)" \
            --notes "Always the newest successful build of the Android app. Open Mono.apk on the phone to install; it upgrades over the previous version and keeps playlists, likes and history." \
            --target "$GITHUB_SHA"
          gh release edit "$tag" --title "Mono $version for Android (latest build)"

          # --clobber removes the old asset before sending the new one, so
          # while the upload is in flight the release carries no APK and the
          # install link 404s. That window is normally a minute or two; the
          # timeout keeps it from becoming open-ended.
          for attempt in 1 2 3 4; do
            if timeout 240 gh release upload "$tag" out/Mono.apk --clobber; then
              echo "Attached Mono.apk on attempt $attempt"
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::Could not attach Mono.apk to the $tag release"
              exit 1
            fi
            echo "Attempt $attempt stalled or failed; retrying"
            sleep $((attempt * 15))
          done

          echo "Direct link: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Mono.apk"

      # Tests and lint run after the upload so a failure in either is loud, but
      # the APK from that same commit is still downloadable rather than lost
      # with the job.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Show the lint findings
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
