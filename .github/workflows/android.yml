name: Build Android APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build web bundle
        run: npx vite build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playthrough smoke test
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          node tests/playthrough.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist/

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/pc-builder-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/pc-builder-release.apk
          ls -lh out

      # An APK that is unsigned, or signed by a key that changes between runs,
      # installs nowhere — and the only symptom is "App not installed" on the
      # phone, long after CI reported success. Check it here instead, and pin
      # the certificate digest so a signing-config change cannot silently
      # break upgrades for anyone who already has the game installed.
      - name: Verify APK signatures
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          EXPECTED=$(keytool -list -keystore android/app/pcbuilder-sideload.jks \
            -storepass pcbuilder -alias pcbuilder -v \
            | grep -oiE 'SHA256: [0-9A-F:]+' | head -1 | tr -d ' ' | cut -d: -f2- | tr -d ':' | tr 'A-Z' 'a-z')
          for apk in out/*.apk; do
            echo "--- $apk"
            "$APKSIGNER" verify --verbose "$apk"
            GOT=$("$APKSIGNER" verify --print-certs "$apk" \
              | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'A-Z' 'a-z')
            if [ "$GOT" != "$EXPECTED" ]; then
              echo "::error::$apk is signed by $GOT, expected the sideload key $EXPECTED"
              exit 1
            fi
            echo "signed by the sideload key"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pc-builder-apk
          path: out/*.apk
          if-no-files-found: error
