<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MONO</title>
    <meta name="description" content="A local music player for the music already on your machine." />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon-64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Shown until a folder is connected. -->
    <section id="welcome" class="welcome" hidden>
      <div class="welcome-inner">
        <div class="wordmark wordmark-lg">
          <span class="disc"><span class="spindle"></span></span>
          <h1>MONO</h1>
        </div>
        <p id="welcome-text">Point Mono at the folder your music lives in. It stays on your machine — nothing is uploaded.</p>
        <button id="pick-folder" class="pill pill-filled">Choose folder</button>
        <p id="welcome-note" class="note" hidden></p>
      </div>
    </section>

    <!-- Main shell. -->
    <div id="shell" class="shell" hidden>
      <header class="topbar">
        <div id="chrome" class="chrome">
          <div class="wordmark">
            <span class="disc"><span class="spindle"></span></span>
            <h1>MONO</h1>
          </div>
          <span id="scan-status" class="scan-status" hidden></span>
          <button id="rescan" class="ghost">Rescan</button>
          <button id="change-folder" class="ghost">Folder</button>
        </div>

        <div id="selectbar" class="chrome selectbar" hidden>
          <button id="sel-clear" class="icon-btn" title="Cancel selection" aria-label="Cancel selection"></button>
          <strong id="sel-count">0 selected</strong>
          <span class="spacer"></span>
          <button id="sel-all" class="ghost">Select all</button>
          <button id="sel-shuffle" class="ghost">Shuffle</button>
          <button id="sel-play" class="ghost">Play</button>
          <button id="sel-add" class="pill pill-filled small">Add to playlist</button>
        </div>

        <div class="searchrow">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
            <input id="search" type="search" placeholder="Search songs and artists" autocomplete="off" spellcheck="false" />
          </label>
        </div>

        <nav id="tabs" class="tabs"></nav>
      </header>

      <main id="content" class="content"></main>

      <!-- Now playing bar -->
      <footer id="bar" class="bar" hidden>
        <div class="bar-progress"><span id="bar-fill"></span></div>
        <div class="bar-inner">
          <img id="bar-art" class="bar-art" alt="" />
          <button id="bar-open" class="bar-text" title="Open player">
            <span id="bar-title" class="bar-title"></span>
            <span id="bar-sub" class="bar-sub"></span>
          </button>
          <button id="bar-like" class="icon-btn" title="Like (L)" aria-label="Like"></button>
          <button id="bar-prev" class="icon-btn" title="Previous (P)" aria-label="Previous"></button>
          <button id="bar-play" class="icon-btn play" title="Play/pause (Space)" aria-label="Play"></button>
          <button id="bar-next" class="icon-btn" title="Next (N)" aria-label="Next"></button>
        </div>
      </footer>
    </div>

    <!-- Full-screen player -->
    <section id="player" class="player" hidden>
      <div id="player-backdrop" class="player-backdrop"></div>
      <div class="player-inner">
        <div class="player-top">
          <button id="player-close" class="icon-btn" title="Close" aria-label="Close"></button>
          <span id="player-folder" class="player-folder"></span>
          <button id="player-like" class="icon-btn" title="Like (L)" aria-label="Like"></button>
        </div>

        <div class="vinyl-wrap">
          <div id="vinyl" class="vinyl">
            <img id="vinyl-art" class="vinyl-art" alt="" />
            <span class="vinyl-hole"></span>
          </div>
        </div>

        <div class="player-meta">
          <h2 id="player-title"></h2>
          <p id="player-artist"></p>
        </div>

        <div class="seek">
          <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
          <div class="times"><span id="time-now">0:00</span><span id="time-end">0:00</span></div>
        </div>

        <div class="controls">
          <button id="ctl-shuffle" class="icon-btn" title="Shuffle (S)" aria-label="Shuffle"></button>
          <button id="ctl-prev" class="icon-btn big" title="Previous (P)" aria-label="Previous"></button>
          <button id="ctl-play" class="play-big" title="Play/pause (Space)" aria-label="Play"></button>
          <button id="ctl-next" class="icon-btn big" title="Next (N)" aria-label="Next"></button>
          <button id="ctl-repeat" class="icon-btn" title="Repeat (R)" aria-label="Repeat"></button>
        </div>
      </div>
    </section>

    <!-- Dialogs -->
    <dialog id="playlist-dialog" class="sheet">
      <h3 id="playlist-dialog-title">Add to playlist</h3>
      <div id="playlist-choices" class="choices"></div>
      <div class="sheet-actions">
        <button id="playlist-new" class="ghost">New playlist</button>
        <button id="playlist-cancel" class="ghost">Cancel</button>
      </div>
    </dialog>

    <dialog id="name-dialog" class="sheet">
      <h3>New playlist</h3>
      <p id="name-hint" class="note" hidden></p>
      <input id="name-input" type="text" placeholder="Name" maxlength="60" />
      <div class="sheet-actions">
        <button id="name-create" class="pill pill-filled small">Create</button>
        <button id="name-cancel" class="ghost">Cancel</button>
      </div>
    </dialog>

    <div id="toast" class="toast" hidden></div>
    <audio id="audio" preload="metadata"></audio>

    <script type="module" src="./app.js"></script>
  </body>
</html>
